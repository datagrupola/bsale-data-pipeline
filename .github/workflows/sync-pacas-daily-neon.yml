name: Sync Pacas daily data to Neon

on:
  schedule:
    # 01:45 America/Mexico_City (UTC-6). Procesa el día fiscal anterior.
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Fecha inicial (YYYY-MM-DD). Vacío = ayer en Ciudad de México"
        required: false
        type: string
      end_date:
        description: "Fecha final (YYYY-MM-DD). Vacío = misma fecha inicial"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pacas-daily-neon-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Documents, returns, payments and daily aggregates
    if: github.event_name == 'workflow_dispatch' || vars.PACAS_DAILY_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      BSALE_ACCESS_TOKEN: ${{ secrets.BSALE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run Pacas unit tests
        run: python -m unittest tests.test_pacas_documents -v

      - name: Resolve date range
        id: target_range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail

          validate_date() {
            local value="$1"
            local parsed_date
            parsed_date="$(date -d "$value" +%F 2>/dev/null || true)"

            if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
              || [[ "$parsed_date" != "$value" ]]; then
              echo "Fecha inválida: $value. Usa YYYY-MM-DD." >&2
              exit 1
            fi
          }

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            start_date="$(TZ=America/Mexico_City date -d 'yesterday' +%F)"
            end_date="$start_date"
          elif [[ -z "$INPUT_START_DATE" && -z "$INPUT_END_DATE" ]]; then
            start_date="$(TZ=America/Mexico_City date -d 'yesterday' +%F)"
            end_date="$start_date"
          elif [[ -z "$INPUT_START_DATE" ]]; then
            echo "Debes indicar start_date cuando uses end_date." >&2
            exit 1
          else
            start_date="$INPUT_START_DATE"
            end_date="${INPUT_END_DATE:-$INPUT_START_DATE}"
          fi

          validate_date "$start_date"
          validate_date "$end_date"

          start_epoch="$(date -d "$start_date" +%s)"
          end_epoch="$(date -d "$end_date" +%s)"

          if (( start_epoch > end_epoch )); then
            echo "Rango inválido: start_date no puede ser posterior a end_date." >&2
            exit 1
          fi

          echo "start_date=$start_date" >> "$GITHUB_OUTPUT"
          echo "end_date=$end_date" >> "$GITHUB_OUTPUT"
          echo "label=$start_date-to-$end_date" >> "$GITHUB_OUTPUT"

      - name: Sync Pacas date range
        shell: bash
        env:
          START_DATE: ${{ steps.target_range.outputs.start_date }}
          END_DATE: ${{ steps.target_range.outputs.end_date }}
        run: |
          set -euo pipefail

          current_date="$START_DATE"

          while [[ "$current_date" < "$END_DATE" || "$current_date" == "$END_DATE" ]]; do
            echo "::group::Pacas $current_date"

            echo "1/4 Persistiendo documentos y vendedores"
            python -m src.pacas.extract_documents \
              --date "$current_date" \
              --write-db \
              --output-dir output

            echo "2/4 Resolviendo devoluciones al vendedor original"
            python -m src.pacas.resolve_returns \
              --date "$current_date" \
              --write-db \
              --output-dir output

            echo "3/4 Persistiendo métodos de pago"
            python -m src.pacas.extract_payments \
              --date "$current_date" \
              --write-db \
              --output-dir output

            echo "4/4 Materializando agregados diarios"
            python -m src.pacas.build_daily \
              --date "$current_date" \
              --write-db \
              --output-dir output

            echo "::endgroup::"
            current_date="$(date -d "$current_date + 1 day" +%F)"
          done

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pacas-neon-sync-${{ steps.target_range.outputs.label || github.run_id }}
          path: output/pacas_*.json
          if-no-files-found: warn
          retention-days: 14
