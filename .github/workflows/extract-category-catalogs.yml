name: Extract Bsale category catalogs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsale-category-catalogs
  cancel-in-progress: false

jobs:
  extract:
    name: Extract category catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BSALE_ACCESS_TOKEN: ${{ secrets.BSALE_ACCESS_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Extract category catalogs
        run: python -m src.extract_category_catalogs --output-dir output

      - name: Upload extraction artifact
        uses: actions/upload-artifact@v7
        with:
          name: bsale-category-catalogs
          path: output/category_catalogs.json
          if-no-files-found: error
          retention-days: 7