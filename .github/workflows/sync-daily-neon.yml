name: Sync Bsale daily data to Neon

on:
  schedule:
    # 01:30 America/Mexico_City (UTC-6). Procesa el día fiscal ya cerrado.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha fiscal a procesar (YYYY-MM-DD). Vacío = ayer en Ciudad de México"
        required: false
        type: string

permissions:
  contents: read

# Evita que una ejecución programada o manual modifique las mismas particiones
# al mismo tiempo. La segunda ejecución queda en cola, nunca cancela a la primera.
concurrency:
  group: bsale-daily-neon-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sales, products and categories
    # El valor ausente se interpreta como apagado. Las ejecuciones manuales
    # siempre están permitidas para reprocesos o pruebas controladas.
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BSALE_ACCESS_TOKEN: ${{ secrets.BSALE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve fiscal date
        id: target_date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_DATE" ]]; then
            parsed_date="$(date -d "$INPUT_DATE" +%F 2>/dev/null || true)"
            if [[ ! "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
              || [[ "$parsed_date" != "$INPUT_DATE" ]]; then
              echo "Fecha inválida: $INPUT_DATE. Usa YYYY-MM-DD." >&2
              exit 1
            fi
            target_date="$INPUT_DATE"
          else
            target_date="$(TZ=America/Mexico_City date -d 'yesterday' +%F)"
          fi

          echo "Procesando fecha fiscal: $target_date"
          echo "date=$target_date" >> "$GITHUB_OUTPUT"

      # El orden es deliberado: products actualiza pieces_sold sobre la partición
      # que daily_sales crea primero. Cualquier error detiene la cadena.
      - name: 1. Persist daily sales
        run: |
          python -m src.extract_daily_sales \
            --date "${{ steps.target_date.outputs.date }}" \
            --write-db \
            --output-dir output

      - name: 2. Persist products and pieces
        run: |
          python -m src.extract_products \
            --start-date "${{ steps.target_date.outputs.date }}" \
            --end-date "${{ steps.target_date.outputs.date }}" \
            --write-db \
            --output-dir output

      - name: 3. Materialize daily categories
        run: |
          python -m src.build_categories_daily \
            --start-date "${{ steps.target_date.outputs.date }}" \
            --end-date "${{ steps.target_date.outputs.date }}" \
            --write-db \
            --output-dir output

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bsale-neon-sync-${{ steps.target_date.outputs.date || github.run_id }}
          path: output/*.json
          if-no-files-found: warn
          retention-days: 14
